<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Perkebunan kopi Gayo di dataran tinggi Aceh saat matahari terbit">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
