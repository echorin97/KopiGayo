      <stop offset="1" stop-color="#D9B183"/>
    </linearGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C5A3E"/><stop offset="1" stop-color="#5B402B"/>
    </linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1">
